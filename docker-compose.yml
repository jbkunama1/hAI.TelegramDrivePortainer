# ============================================================
# Portainer Stack: hAI.TelegramDrivePortainer
# Telegram-Drive als Docker Container mit VNC-Access
# ============================================================
#
# WICHTIG - Passwort setzen:
# NICHT hier im Editor hart codieren, sondern in Portainer unten im
# Feld 'Environment variables' eintragen:
#   VNC_PASSWORD=dein-sicheres-passwort
# (UI-Variablen greifen nur ueber die ${...}-Interpolation!)
# ============================================================

services:
  telegram-drive:
    image: ghcr.io/jbkunama1/hai.telegramdriveportainer:latest
    container_name: telegram-drive
    restart: unless-stopped

    # Ports
    ports:
      - "6080:6080"    # noVNC Web-Interface (Browser-Zugriff)
      - "5900:5900"    # VNC (für VNC-Clients)
      - "8550:8560"    # REST-API (socat-Proxy intern -> 127.0.0.1:8550 der App)
                       # NICHT 8550:8550 - die App bindet nur Loopback!

    # Environment-Variablen (per Portainer UI-Feld ueberschreibbar)
    environment:
      - VNC_PASSWORD=${VNC_PASSWORD:-telegram123}
      - TZ=${TZ:-Europe/Berlin}

    # Volumes für Persistenz
    # - /root/.config komplett (Tauri-Identifier kann abweichen)
    # - Keyrings: gespeicherte Credentials (Secure Storage)
    volumes:
      - telegram-drive-data:/root/.config
      - telegram-drive-keyrings:/root/.local/share/keyrings
      - telegram-drive-downloads:/root/Downloads

    # Ressourcen-Limits
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

    # Security-Optionen
    security_opt:
      - no-new-privileges:true

    # Logging
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    # Healthcheck (noVNC-Web-Port erreichbar?)
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:6080/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  telegram-drive-data:
    name: telegram-drive-data
    driver: local
  telegram-drive-keyrings:
    name: telegram-drive-keyrings
    driver: local
  telegram-drive-downloads:
    name: telegram-drive-downloads
    driver: local

networks:
  default:
    name: telegram-drive-network
    driver: bridge
